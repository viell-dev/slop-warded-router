[package]
name = "warded-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
actix-web = { version = "=4.19.0", default-features = false }
warp = { version = "=0.4.3", default-features = false, features = ["test"] }
salvo = { package = "salvo_core", version = "=1.1.1", default-features = false, features = ["test"] }
rama-core = "=0.4.0"
rama-http = "=0.4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
parse-net = "=0.9.3"
headers-accept = "=0.3.0"
negotiator = "=0.1.0"

