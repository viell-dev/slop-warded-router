name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Run the repository verification entry point
        shell: bash
        run: bash scripts/check.sh

  ci:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
