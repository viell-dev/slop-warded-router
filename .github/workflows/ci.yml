name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede older PR runs and keep a run for each non-PR trigger.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Run the repository verification entry point
        shell: bash
        run: bash scripts/check.sh
      - name: Test the release checks
        if: runner.os == 'Linux'
        run: bash .github/scripts/release-test.sh
      - name: Test the Pages release resolution
        if: runner.os == 'Linux'
        run: bash .github/scripts/pages-test.sh

  dependencies:
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: 0.20.2
      # SHA-256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz, as
      # published beside that release asset.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install pinned cargo-deny
        run: |
          archive="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Check advisories, licenses, bans and sources
        run: cargo-deny --locked check

  # The documentation site builds with VitePress, which fails on links to missing pages; the
  # site configuration also fails on links to missing headings. The checks job runs its Rust
  # examples. The Pages workflow deploys the site from release tags only.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/.nvmrc
      - name: Install the pinned site tooling
        run: npm ci --no-audit --no-fund
      - name: Build the site
        run: npm run build

  ci:
    if: always()
    needs: [checks, dependencies, site]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform, dependency and site check
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          test "$CHECK_RESULT" = success && test "$DEPENDENCY_RESULT" = success &&
            test "$SITE_RESULT" = success
