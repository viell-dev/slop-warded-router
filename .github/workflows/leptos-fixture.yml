name: Leptos fixture

# Pull requests always run the cheap `changes` and `leptos-fixture` jobs so that
# `leptos-fixture` can be a required check; the expensive fixture job runs only
# when an affected path changed. Pushes to main use the same paths as filters.
# Tag pushes ignore path filters, so every version tag runs the fixture.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'integration/leptos/**'
      - '!integration/leptos/**/*.md'
      - '.github/workflows/leptos-fixture.yml'
      - '.github/scripts/fixture-affected.sh'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Supersede older PR runs. Each push, tag and manual run has its own group.
  group: leptos-fixture-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.paths.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Self-test the fixture path gate
        run: |
          expect() {
            local expected="$1" label="$2" path actual
            shift 2
            actual="$(for path in "$@"; do printf '%s\0' "$path"; done |
              bash .github/scripts/fixture-affected.sh)"
            if [[ "$actual" != "affected=$expected" ]]; then
              printf '%s: expected affected=%s, got %s\n' "$label" "$expected" "$actual" >&2
              exit 1
            fi
            printf '%s: %s\n' "$label" "$actual"
          }
          expect true 'asset moved out of fixture' integration/leptos/public/favicon.ico docs/favicon.ico
          expect true 'non-ASCII source path' src/café.rs
          expect false 'fixture Markdown only' integration/leptos/docs/notes.md
          expect false 'library lockfile only' Cargo.lock
          expect true 'workflow only' .github/workflows/leptos-fixture.yml
          expect true 'path gate only' .github/scripts/fixture-affected.sh
          expect false 'empty list'
      - name: Detect fixture-affecting changes
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The first parent of the PR merge commit is the base. List both sides
          # of renames as a deletion and addition, and preserve path bytes.
          set -o pipefail
          decision="$(git -c core.quotePath=false diff --no-renames -z --name-only HEAD^1 HEAD |
            bash .github/scripts/fixture-affected.sh)"
          printf '%s\n' "$decision" | tee -a "$GITHUB_OUTPUT"

  fixture:
    name: Linux HTTP and browser fixture
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export exact source and build the fixture image
        timeout-minutes: 20
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          evidence="$RUNNER_TEMP/warded-fixture-evidence"
          mkdir "$evidence"
          git rev-parse HEAD | tee "$evidence/commit.txt"
          if [[ -n "$PR_HEAD_SHA" ]]; then
            printf 'head=%s\nbase=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA" | tee "$evidence/pull-request.txt"
          fi
          git rev-parse 'HEAD^{tree}' | tee "$evidence/tree.txt"
          git archive --format=tar --output="$RUNNER_TEMP/warded-fixture-source.tar" HEAD
          sha256sum "$RUNNER_TEMP/warded-fixture-source.tar" | tee "$evidence/archive-sha256.txt"
          docker build --tag warded-leptos-test integration/leptos 2>&1 | tee "$evidence/image-build.log"
          docker image inspect --format '{{.Id}}' warded-leptos-test | tee "$evidence/image-id.txt"
      - name: Run the complete fixture
        timeout-minutes: 18
        run: |
          evidence="$RUNNER_TEMP/warded-fixture-evidence"
          revision="commit:$(cat "$evidence/commit.txt")"
          docker create --interactive --cidfile "$RUNNER_TEMP/warded-fixture.cid" \
            --cpus 4 --memory 6g --pids-limit 1024 --shm-size 1g \
            --env "WARDED_FIXTURE_REVISION=$revision" warded-leptos-test \
            bash -euc 'tar -xf - -C /app
              cd /app/integration/leptos
              exec timeout --kill-after=30s 15m bash check.sh'
          container="$(cat "$RUNNER_TEMP/warded-fixture.cid")"
          docker start --attach --interactive "$container" <"$RUNNER_TEMP/warded-fixture-source.tar" \
            2>&1 | tee "$evidence/fixture.log"
      - name: Collect reports and remove the container
        if: always()
        timeout-minutes: 3
        run: |
          cidfile="$RUNNER_TEMP/warded-fixture.cid"
          if [[ ! -s "$cidfile" ]]; then exit 0; fi
          container="$(cat "$cidfile")"
          evidence="$RUNNER_TEMP/warded-fixture-evidence"
          status=0
          docker stop -t 10 "$container" >/dev/null || status=1
          # docker cp without --archive creates runner-owned output.
          docker cp "$container:/app/integration/leptos/artifacts/." "$evidence/" || status=1
          docker rm -f "$container"
          if docker container inspect "$container" >/dev/null 2>&1; then
            echo "Fixture container survived cleanup" >&2
            exit 1
          fi
          echo "Verified fixture container removal" | tee "$evidence/container-cleanup.txt"
          exit "$status"
      - name: Upload fixture evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leptos-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/warded-fixture-evidence
          if-no-files-found: error
          retention-days: 14

  # The required check. It fails unless change detection succeeded and the
  # fixture either passed or was skipped because nothing it uses changed.
  leptos-fixture:
    if: always()
    needs: [changes, fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the fixture when affected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AFFECTED: ${{ needs.changes.outputs.affected }}
          FIXTURE_RESULT: ${{ needs.fixture.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$AFFECTED:$FIXTURE_RESULT" in
            true:success|false:skipped) ;;
            *)
              printf 'Unexpected fixture gate state: affected=%q, fixture=%q\n' \
                "$AFFECTED" "$FIXTURE_RESULT" >&2
              exit 1
              ;;
          esac
