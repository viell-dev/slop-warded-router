version: 2
updates:
  # The library's workspace manifest and lockfile, including the documentation
  # site's example checks under docs/. The Leptos fixture under
  # integration/ pins its upstream starter deliberately and is updated by hand.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "Type: Maintenance"
    commit-message:
      prefix: "Update"
    # Group patch updates only: a 0.x minor update (such as 0.9 to 0.10) is a
    # breaking Cargo change and gets its own pull request.
    groups:
      cargo-patch:
        update-types:
          - patch
  # The documentation site's tooling. VitePress 2 is pinned to an exact prerelease, and its
  # updates get their own pull requests; CI builds the site with each.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "Type: Maintenance"
    commit-message:
      prefix: "Update"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "Type: Maintenance"
    commit-message:
      prefix: "Update"
    groups:
      actions:
        patterns:
          - "*"
