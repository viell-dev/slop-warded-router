[package]
name = "warded"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Ordered routing over complete HTTP request-head conditions"
repository = "https://github.com/viell-dev/slop-warded-router"
readme = "README.md"
publish = false
keywords = ["http", "router", "tower", "routing"]
categories = ["web-programming::http-server"]
exclude = ["research/", ".github/", "AGENTS.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["tower", "negotiation"]
tower = ["dep:tower"]
negotiation = ["dep:parse-net", "dep:oxilangtag"]

[dependencies]
http = "1.5"
matchit = "0.9.2"
parse-net = { version = "=0.9.3", optional = true }
oxilangtag = { version = "0.1.6", default-features = false, optional = true }
tower = { version = "0.5.3", optional = true, features = ["util"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
http-body = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }

[[example]]
name = "server"
required-features = ["tower", "negotiation"]

[[example]]
name = "basic"
required-features = ["tower", "negotiation"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[bench]]
name = "selection"
harness = false
required-features = ["negotiation"]

[lints.clippy]
all = { level = "warn", priority = -1 }
